[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ciplink-tagserver"
version = "0.2.0"
description = "One server per site that owns the PLC connections and serves tag values over a WebSocket"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rowan Ramamurthy", email = "rramamurthy@factoryautomation.com" }]
keywords = ["plc", "allen-bradley", "logix", "ethernet-ip", "hmi", "websocket", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
requires-python = ">=3.11"
dependencies = [
    "ciplink>=0.1,<0.2",
    "fastapi",
    "uvicorn[standard]",
]

[project.urls]
Source = "https://github.com/RowanRama/ciplink-tagserver"
Driver = "https://github.com/RowanRama/ciplink"
"React client" = "https://www.npmjs.com/package/@ciplink/react"

[project.scripts]
ciplink-tagserver = "ciplink_tagserver.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-timeout", "httpx"]

[tool.setuptools]
packages = ["ciplink_tagserver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
